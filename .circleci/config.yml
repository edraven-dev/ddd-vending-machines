version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@2.0.1
  node: circleci/node@7.2.1
  nx: nrwl/nx@1.7.0 # only for nx/set-shas (plain Node + the CircleCI API, no Nx packages)

jobs:
  generate-config:
    executor: continuation/default
    resource_class: small
    steps:
      - checkout
      - node/install
      - run:
          name: Fetch the main branches for affected detection
          command: git fetch --quiet origin develop master
      # Base for "affected": the last successful build-lint-test-deploy workflow on master/develop (a run still
      # waiting for its deploy approval doesn't count), or the merge-base with develop on other branches.
      # Reading workflows needs a personal API token in the CIRCLE_API_TOKEN project environment variable.
      - when:
          condition:
            equal: [master, << pipeline.git.branch >>]
          steps:
            - nx/set-shas:
                main-branch-name: master
                workflow-name: build-lint-test-deploy
      - unless:
          condition:
            equal: [master, << pipeline.git.branch >>]
          steps:
            - nx/set-shas:
                main-branch-name: develop
                workflow-name: build-lint-test-deploy
      - run:
          name: Generate config
          command: bash ./.circleci/generate-config.sh
          environment:
            # The branch tip before this push: on master/develop the base is never newer than this
            BASE_REVISION: << pipeline.git.base_revision >>
      - continuation/continue:
          configuration_path: .circleci/generated-config.yml

workflows:
  setup:
    jobs:
      - generate-config
