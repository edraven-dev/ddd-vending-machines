syntax = "proto3";

package snack_machine;

service SnackMachineProtoService {
  rpc UnloadMoney (UnloadMoneyRequest) returns (UnloadMoneyResponse) {}
  rpc CreateSnackMachine (CreateSnackMachineRequest) returns (Empty) {}
  rpc DeleteSnackMachine (DeleteSnackMachineRequest) returns (Empty) {}
}

message UnloadMoneyRequest {
  string id = 1;
}

message UnloadMoneyResponse {
  repeated double money = 1;
}

message CreateSnackMachineRequest {
  string id = 1;
}

message DeleteSnackMachineRequest {
  string id = 1;
}

message Empty {}
