packages:
  - apps/*
  - libs/*

# One flat node_modules (like npm): every package shares a single copy of each
# NestJS package, which Nest's dependency injection relies on.
nodeLinker: hoisted

saveExact: true

overrides:
  vite: 7.1.3

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  '@nestjs/core': false
  '@scarf/scarf': false
  core-js-pure: false
  protobufjs: false
