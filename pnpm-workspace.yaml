packages:
  - apps/*
  - libs/*

# One flat node_modules (like npm): every package shares a single copy of each
# NestJS package, which Nest's dependency injection relies on.
nodeLinker: hoisted
saveExact: true
catalogMode: strict

catalog:
  '@grpc/grpc-js': 1.14.7
  '@grpc/proto-loader': 0.8.1
  '@mikro-orm/cli': 7.2.8
  '@mikro-orm/core': 7.2.8
  '@mikro-orm/decorators': 7.2.8
  '@mikro-orm/migrations': 7.2.8
  '@mikro-orm/nestjs': 7.1.0
  '@mikro-orm/postgresql': 7.2.8
  '@mikro-orm/seeder': 7.2.8
  '@mikro-orm/sql-highlighter': 1.0.1
  '@nestjs/bullmq': 12.0.1
  '@nestjs/cli': 12.0.12
  '@nestjs/common': 12.4.2
  '@nestjs/core': 12.4.2
  '@nestjs/cqrs': 12.1.2
  '@nestjs/microservices': 12.4.2
  '@nestjs/platform-express': 12.4.2
  '@nestjs/schematics': 12.0.13
  '@nestjs/swagger': 12.1.1
  '@nestjs/testing': 12.4.2
  '@oxc-node/core': 1.0.1
  '@types/express': 5.0.6
  '@types/node': 26.6.6
  '@types/supertest': 7.2.1
  '@vitest/coverage-v8': 5.1.0
  amqp-connection-manager: 5.0.1
  amqplib: 2.3.1
  bson: 7.3.4
  currency.js: 2.0.4
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2006
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.2
  svelte: 5.57.3
  tiny-types: 2.0.5
  tsdown: 0.23.7
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  msgpackr-extract: true
  '@nestjs/core': false
  '@scarf/scarf': false
  core-js-pure: false
  protobufjs: false
